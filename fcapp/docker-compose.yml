version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fcapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fcapp
      POSTGRES_PASSWORD: fcapp_dev_password
      POSTGRES_DB: fcapp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcapp -d fcapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
